[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonnet-orchestrator"
version = "0.1.0"
description = "Fault-tolerant real-time constrained sonnet compiler / coordination controller for the FLOP Labs SonnetChallenge"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "typer>=0.12", "rich>=13", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sonnet-orchestrator = "sonnet_orchestrator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
